plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.example.trainarrivals'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.example.trainarrivals'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: uses only the Android platform APIs.
